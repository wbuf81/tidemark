name: Bug report
description: Something in Tidemark doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tidemark version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't paste session titles, project names, emails or anything private. Describe it instead.
